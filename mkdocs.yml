# ==============================================================================
# CARINA — MkDocs Configuration (Material for MkDocs)
# Controlled Artificial Road-traffic Intelligence Network Architecture
# Copyright (C) 2026 — Noxfort Systems
# ==============================================================================

site_name: "CARINA — Technical Documentation"
site_description: "Internal technical documentation for CARINA — neural brain of the Noxfort ecosystem."
site_author: "Gabriel Moraes — Noxfort Systems"
copyright: "Copyright &copy; 2026 — Noxfort Systems"

# Exclude conflicting GitHub folder readme from MkDocs build
exclude_docs: |
  /README.md

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore

# ==============================================================================
# Theme
# ==============================================================================
theme:
  name: material
  language: en
  logo: assets/carina-logo.png
  favicon: assets/carina-logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark Mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# ==============================================================================
# Markdown Extensions
# ==============================================================================
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# ==============================================================================
# Plugins
# ==============================================================================
plugins:
  - search

