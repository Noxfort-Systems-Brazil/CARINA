# ==============================================================================
# CARINA — MkDocs Configuration (Material for MkDocs)
# Controlled Artificial Road-traffic Intelligence Network Architecture
# Copyright (C) 2026 — Noxfort Systems
# ==============================================================================

site_name: "CARINA — Technical Documentation"
site_description: "Internal technical documentation for CARINA — neural brain of the Noxfort ecosystem."
site_author: "Gabriel Moraes — Noxfort Systems"
copyright: "Copyright &copy; 2026 — Noxfort Systems"

# ==============================================================================
# Theme
# ==============================================================================
theme:
  name: material
  language: en
  icon:
    logo: material/traffic-light
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark Mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# ==============================================================================
# Markdown Extensions
# ==============================================================================
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# ==============================================================================
# Plugins
# ==============================================================================
plugins:
  - search

# ==============================================================================
# Navigation
# ==============================================================================
nav:
  - Overview: index.md
  - Master MOC: CARINA_MOC.md
  - Architecture & Core:
    - Synapse HFT API: API_REFERENCE.md
    - Database & Schemas: DATABASE_AND_SCHEMAS.md
    - Security & Auth: SECURITY_AND_AUTH.md
  - Artificial Intelligence:
    - Neural Research: RESEARCH_NOTES.md
    - Safety & Watchdog: SAFETY_AND_WATCHDOG.md
    - Explainable AI (XAI): XAI_AND_SAS.md
    - Small Language Models: SLM_AND_LOCAL_LLM.md
    - Report Blocks Engine: REPORT_BLOCKS_AND_TEMPLATES.md
  - Hardware & Physical Control:
    - Hardware Drivers: HARDWARE_DRIVERS.md
    - Traffic Warrants: TRAFFIC_ENGINEERING_WARRANTS.md
    - MFD & Analytics: MFD_AND_ANALYTICS.md
  - Frontend & Graphics:
    - UI & Dashboard: UI_AND_DASHBOARD.md
    - Rendering & Heatmaps: RENDERING_AND_HEATMAPS.md
  - Operations & QA:
    - Developer Guides: DEVELOPER_GUIDES.md
    - Testing & Validation: TESTING.md
    - Deployment & Packaging: DEPLOYMENT_AND_PACKAGING.md

# ==============================================================================
# Extra CSS
# ==============================================================================
extra_css:
  - stylesheets/extra.css
