# Alembic configuration for CARINA_CORE
# Supports SQLite and PostgreSQL with runtime environment injection

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = . src

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Max length of characters for "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# Search path for version locations
version_locations = %(here)s/migrations/versions

# Path separator for version locations
path_separator = os

# Output encoding
output_encoding = utf-8

sqlalchemy.url = sqlite:///results/database/carina_data.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
