[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carina_core"
version = "1.0.0"
description = "Controlled Artificial Road-traffic Intelligence Network Architecture"
license = { text = "AGPL-3.0-or-later" }
authors = [
    {name = "Gabriel Moraes", email = "gmateusmoraes@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "flet>=0.25.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "websockets>=12.0",
    "prometheus_client>=0.20.0",
    "psutil>=5.9.0",
    "xxhash>=3.4.0",
    "pynvml>=11.5.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "pyproj>=3.6.0",
    "torch>=2.4.0",
    "torch-geometric>=2.6.1",
    "transformers>=4.46.0",
    "llama-cpp-python>=0.2.75",
    "accelerate>=1.0.0",
    "captum>=0.7.0",
    "scikit-learn>=1.3.0",
    "tensorboard>=2.14.0",
    "python-dotenv>=1.0.0",
    "protobuf>=5.28.0",
    "scipy>=1.13.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "paho-mqtt>=2.1.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pysnmp>=7.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "sumolib>=1.18.0",
    "traci>=1.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = [".", "src", "proto", "ui"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = [
    "tests",
]
markers = [
    "unit: marks unit tests",
    "integration: marks integration tests",
    "benchmark: marks benchmark tests",
    "slow: marks slow tests",
]
