[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the project root to PYTHONPATH so we can import src and ui modules easily
pythonpath = .

# Useful default flags:
# -v: verbose
# --strict-markers: fail if using an unregistered marker
addopts = -v --strict-markers

markers =
    unit: testes unitarios isolados
    integration: testes de integracao que podem tocar em multiplos modulos
